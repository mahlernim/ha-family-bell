[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-family-bell"
version = "0.4.1"
description = "Routine, weekly, and one-time family bell scheduler for Home Assistant"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "mahlernim" }]

[project.optional-dependencies]
test = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "LOG", "SIM", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
